name: VPN Sub Aggregator

concurrency:
  group: vpn-sub-aggregator
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aggregate nodes & upload to Gist
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          python aggregate.py

      - name: Upload artifacts (90 天)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-subscription
          path: |
            output/sub.txt
            output/jvhe.txt
            output/report.json
          retention-days: 90
          compression-level: 9