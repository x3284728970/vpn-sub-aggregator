name: VPN Sub Aggregator

# 互斥组：防止上一轮还没跑完就触发下一轮
concurrency:
  group: vpn-sub-aggregator
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 0 */2 * *"   # 每 48 小时的 00:00 UTC 执行一次
  workflow_dispatch:
    inputs:
      ben_token:
        description: "手动覆盖 BEN_TOKEN（留空则使用 Secrets）"
        required: false
        type: string

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aggregate nodes
        env:
          BEN_TOKEN: ${{ inputs.ben_token || secrets.BEN_TOKEN }}
        run: |
          python aggregate.py

      - name: Upload artifacts (90 天)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-subscription
          path: |
            output/sub.txt
            output/sub_b64.txt
            output/report.json
          retention-days: 90
          compression-level: 9

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          destination_dir: .
          keep_files: false
          publish_branch_name: gh-pages
          enable_jekyll: false